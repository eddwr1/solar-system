name: Solar System Workflow

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/*'

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Setup Node.js environment
              uses: actions/setup-node@v7.1.0
              with:
                node-version: 18

            - name: Install dependencies
              run: npm install
            
            - name: Unit Test
              run: npm test